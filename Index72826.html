<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Department Management System</title>
  <style>
    :root {
      --bg-color: #f4f5f7;
      --text-color: #000000;
      --card-bg: #ffffff;
      --border-color: #cccccc;
      --primary-color: #1d4ed8;
      --danger-color: #dc2626;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #ffffff;
      --card-bg: #1e1e1e;
      --border-color: #333333;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* Modal Layouts */
    .mo {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .mo.active { display: flex; }

    .md {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 24px;
      width: 90vw;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .md.report-modal { max-width: 900px; }

    .mh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .mt2 { font-size: 1.25rem; font-weight: bold; }
    .mx { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-color); }

    .fg { display: flex; flex-direction: column; margin-bottom: 12px; }
    .fg label { font-weight: 600; margin-bottom: 4px; }
    .fg input, .fg select, .fg textarea {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--card-bg);
      color: var(--text-color);
    }
    .fr2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .mf { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: 600; }
    .bp { background: var(--primary-color); color: #ffffff !important; }
    .bd { background: var(--danger-color); color: #ffffff !important; }
    .bg { background: #6b7280; color: #ffffff !important; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }

    @media print {
      body * { visibility: hidden; }
      #print-report-target, #print-report-target * { visibility: visible; }
      #print-report-target {
        position: absolute; left: 0; top: 0; width: 100%;
        color: #000000 !important; background: #ffffff !important; padding: 20px;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div id="app">
    <h1>Department Portal</h1>
    
    <section>
      <h2>Personnel Management</h2>
      <button class="btn bp no-print" onclick="openPersonnelModal()">Add Member</button>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Badge #</th>
            <th>Contact</th>
            <th class="no-print">Actions</th>
          </tr>
        </thead>
        <tbody id="personnel-list"></tbody>
      </table>
    </section>

    <section style="margin-top: 30px;">
      <h2>Reports & Logs</h2>
      <button class="btn bp no-print" onclick="openReportModal()">Create New Report</button>
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Title</th>
            <th>Summary</th>
            <th class="no-print">Actions</th>
          </tr>
        </thead>
        <tbody id="reports-list"></tbody>
      </table>
    </section>
  </div>

  <div id="print-report-target"></div>

  <!-- Personnel Modal -->
  <div id="mo-pers" class="mo">
    <div class="md">
      <div class="mh">
        <div class="mt2" id="pers-mtitle">MEMBER DETAILS</div>
        <button class="mx" onclick="CM('mo-pers')">✕</button>
      </div>
      <div class="mb">
        <input type="hidden" id="pers-id">
        <div class="fr2">
          <div class="fg"><label>First Name</label><input id="pers-fname"></div>
          <div class="fg"><label>Last Name</label><input id="pers-lname"></div>
        </div>
        <div class="fr2">
          <div class="fg">
            <label>Role / Position</label>
            <select id="pers-role">
              <option>Chief</option>
              <option>Asst. Chief</option>
              <option>Captain</option>
              <option>Firefighter</option>
            </select>
          </div>
          <div class="fg"><label>Badge #</label><input id="pers-bdg"></div>
        </div>
        <div class="fr2">
          <div class="fg"><label>Email</label><input type="email" id="pers-em"></div>
          <div class="fg"><label>Phone</label><input type="tel" id="pers-ph"></div>
        </div>
      </div>
      <div class="mf">
        <button class="btn bg" onclick="CM('mo-pers')">Cancel</button>
        <button class="btn bp" onclick="savePersonnel()">💾 Save Member</button>
      </div>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="mo-report" class="mo">
    <div class="md report-modal">
      <div class="mh">
        <div class="mt2">INCIDENT REPORT</div>
        <button class="mx" onclick="CM('mo-report')">✕</button>
      </div>
      <div class="mb" id="report-modal-body">
        <input type="hidden" id="rep-id">
        <div class="fr2">
          <div class="fg"><label>Report Date</label><input type="date" id="rep-date"></div>
          <div class="fg"><label>Incident Type</label><input id="rep-type" placeholder="e.g. Structure Fire, EMS"></div>
        </div>
        <div class="fg"><label>Title / Location</label><input id="rep-title"></div>
        <div class="fg">
          <label>Detailed Incident Narrative</label>
          <textarea id="rep-notes" style="min-height: 200px;" placeholder="Full details..."></textarea>
        </div>
      </div>
      <div class="mf">
        <button class="btn bg" onclick="CM('mo-report')">Cancel</button>
        <button class="btn bp" onclick="printCurrentReport()">🖨️ Print Report</button>
        <button class="btn bp" onclick="saveReport()">💾 Save Report</button>
      </div>
    </div>
  </div>

  <script>
    let currentUser = { name: "Admin User", role: "Admin" };

    const defaultData = {
      personnel: [
        { id: "1", fname: "John", lname: "Doe", role: "Captain", bdg: "101", em: "jdoe@dept.org", ph: "555-0192" },
        { id: "2", fname: "Jane", lname: "Smith", role: "Firefighter", bdg: "104", em: "jsmith@dept.org", ph: "555-0144" }
      ],
      reports: [
        { id: "r1", date: "2026-02-10", incidentType: "EMS Call", title: "Main St Assist", notes: "Patient evaluated and transferred." }
      ],
      archives: []
    };

    let appData = defaultData;

    window.onload = function() {
      loadState();
      dedupePersonnel();
      handleYearlyArchive();
      renderPersonnel();
      renderReports();
    };

    function loadState() {
      const saved = localStorage.getItem('dept_app_data');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          
          // Migration check for legacy keys (fn -> fname, ln -> lname)
          if (Array.isArray(parsed.personnel)) {
            parsed.personnel = parsed.personnel.map(p => ({
              ...p,
              fname: p.fname || p.fn || '',
              lname: p.lname || p.ln || ''
            }));
          }

          // Migration check for legacy report keys (type -> incidentType)
          if (Array.isArray(parsed.reports)) {
            parsed.reports = parsed.reports.map(r => ({
              ...r,
              incidentType: r.incidentType || r.type || ''
            }));
          }

          appData = {
            personnel: parsed.personnel || defaultData.personnel,
            reports: parsed.reports || defaultData.reports,
            archives: parsed.archives || []
          };
        } catch (e) {
          console.error("Failed to parse local storage data, reverting safely.", e);
          appData = defaultData;
        }
      }
    }

    function saveState() {
      try {
        localStorage.setItem('dept_app_data', JSON.stringify(appData));
      } catch (e) {
        console.error("Storage limit reached or localStorage disabled.", e);
      }
    }

    function dedupePersonnel() {
      if (!Array.isArray(appData.personnel)) return;
      
      const uniqueMap = new Map();
      appData.personnel.forEach(member => {
        const fname = (member.fname || member.fn || '').trim().toLowerCase();
        const lname = (member.lname || member.ln || '').trim().toLowerCase();
        
        // If names are missing, fallback to unique id
        const key = (fname || lname) ? `${fname}_${lname}` : member.id;

        if (!uniqueMap.has(key)) {
          uniqueMap.set(key, { ...member });
        } else {
          const existing = uniqueMap.get(key);
          if (!existing.bdg && member.bdg) existing.bdg = member.bdg;
          if (!existing.em && member.em) existing.em = member.em;
          if (!existing.ph && member.ph) existing.ph = member.ph;
          if (!existing.role && member.role) existing.role = member.role;
        }
      });
      appData.personnel = Array.from(uniqueMap.values());
      saveState();
    }

    function renderPersonnel() {
      const list = document.getElementById('personnel-list');
      if (!list) return;
      list.innerHTML = '';
      
      (appData.personnel || []).forEach(p => {
        const tr = document.createElement('tr');
        const actionHtml = currentUser.role === 'Admin' 
          ? `<button class="btn bg" onclick="editPersonnel('${p.id}')">Edit</button>
             <button class="btn bd" onclick="deletePersonnel('${p.id}')">Delete</button>`
          : `<span style="font-size:0.85rem; color:#666;">View Only</span>`;

        tr.innerHTML = `
          <td>${p.fname || ''} ${p.lname || ''}</td>
          <td>${p.role || ''}</td>
          <td>${p.bdg || 'N/A'}</td>
          <td>${p.em || ''} ${p.ph ? '| ' + p.ph : ''}</td>
          <td class="no-print">${actionHtml}</td>
        `;
        list.appendChild(tr);
      });
    }

    function renderReports() {
      const list = document.getElementById('reports-list');
      if (!list) return;
      list.innerHTML = '';

      (appData.reports || []).forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.date || ''}</td>
          <td><strong>${r.incidentType || ''}</strong></td>
          <td>${r.title || ''}</td>
          <td>${r.notes ? r.notes.substring(0, 30) + '...' : ''}</td>
          <td class="no-print">
            <button class="btn bg" onclick="openReportModal('${r.id}')">Open / Edit</button>
            <button class="btn bp" onclick="printSingleReport('${r.id}')">Print</button>
            <button class="btn bd" onclick="deleteReport('${r.id}')">Delete</button>
          </td>
        `;
        list.appendChild(tr);
      });
    }

    function handleYearlyArchive() {
      const currentYear = new Date().getFullYear();
      const lastArchivedYear = localStorage.getItem('last_archived_year');

      if (lastArchivedYear && parseInt(lastArchivedYear) < currentYear) {
        const reportsToArchive = appData.reports.filter(r => {
          const repYear = new Date(r.date).getFullYear();
          return !isNaN(repYear) && repYear < currentYear;
        });

        if (reportsToArchive.length > 0) {
          if (!appData.archives) appData.archives = [];
          appData.archives.push({
            year: lastArchivedYear,
            archivedOn: new Date().toISOString(),
            reports: reportsToArchive
          });
          appData.reports = appData.reports.filter(r => new Date(r.date).getFullYear() === currentYear);
        }
        localStorage.setItem('last_archived_year', currentYear.toString());
        saveState();
      } else if (!lastArchivedYear) {
        localStorage.setItem('last_archived_year', currentYear.toString());
      }
    }

    function printSingleReport(reportId) {
      const rep = appData.reports.find(r => r.id === reportId);
      if (!rep) return;

      const printContainer = document.getElementById('print-report-target');
      printContainer.innerHTML = `
        <div style="border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
          <h1>OFFICIAL INCIDENT REPORT</h1>
          <p><strong>Date:</strong> ${rep.date || 'N/A'} | <strong>Type:</strong> ${rep.incidentType || 'N/A'}</p>
        </div>
        <h3>${rep.title || 'Untitled'}</h3>
        <p style="white-space: pre-wrap; line-height: 1.5;">${rep.notes || ''}</p>
      `;
      window.print();
    }

    function printCurrentReport() {
      const id = document.getElementById('rep-id').value;
      if (id) {
        printSingleReport(id);
      } else {
        alert("Please save the report before printing.");
      }
    }

    function CM(modalId) {
      const el = document.getElementById(modalId);
      if (el) el.classList.remove('active');
    }

    function openPersonnelModal() {
      document.getElementById('pers-id').value = '';
      document.getElementById('pers-fname').value = '';
      document.getElementById('pers-lname').value = '';
      document.getElementById('pers-bdg').value = '';
      document.getElementById('pers-em').value = '';
      document.getElementById('pers-ph').value = '';
      document.getElementById('mo-pers').classList.add('active');
    }

    function editPersonnel(id) {
      const p = appData.personnel.find(x => x.id === id);
      if (!p) return;
      document.getElementById('pers-id').value = p.id;
      document.getElementById('pers-fname').value = p.fname || p.fn || '';
      document.getElementById('pers-lname').value = p.lname || p.ln || '';
      document.getElementById('pers-role').value = p.role || 'Firefighter';
      document.getElementById('pers-bdg').value = p.bdg || '';
      document.getElementById('pers-em').value = p.em || '';
      document.getElementById('pers-ph').value = p.ph || '';
      document.getElementById('mo-pers').classList.add('active');
    }

    function deletePersonnel(id) {
      if (confirm("Are you sure you want to delete this member?")) {
        appData.personnel = appData.personnel.filter(x => x.id !== id);
        saveState();
        renderPersonnel();
      }
    }

    function savePersonnel() {
      const id = document.getElementById('pers-id').value;
      const fname = document.getElementById('pers-fname').value.trim();
      const lname = document.getElementById('pers-lname').value.trim();

      if (!fname || !lname) return alert("First and Last Name are required.");

      if (id) {
        const index = appData.personnel.findIndex(x => x.id === id);
        if (index !== -1) {
          appData.personnel[index] = {
            id, fname, lname,
            role: document.getElementById('pers-role').value,
            bdg: document.getElementById('pers-bdg').value,
            em: document.getElementById('pers-em').value,
            ph: document.getElementById('pers-ph').value
          };
        }
      } else {
        appData.personnel.push({
          id: Date.now().toString(),
          fname, lname,
          role: document.getElementById('pers-role').value,
          bdg: document.getElementById('pers-bdg').value,
          em: document.getElementById('pers-em').value,
          ph: document.getElementById('pers-ph').value
        });
      }

      dedupePersonnel();
      saveState();
      renderPersonnel();
      CM('mo-pers');
    }

    function openReportModal(id = null) {
      if (id) {
        const r = appData.reports.find(x => x.id === id);
        if (r) {
          document.getElementById('rep-id').value = r.id;
          document.getElementById('rep-date').value = r.date || '';
          document.getElementById('rep-type').value = r.incidentType || r.type || '';
          document.getElementById('rep-title').value = r.title || '';
          document.getElementById('rep-notes').value = r.notes || '';
        }
      } else {
        document.getElementById('rep-id').value = '';
        document.getElementById('rep-date').value = new Date().toISOString().split('T')[0];
        document.getElementById('rep-type').value = '';
        document.getElementById('rep-title').value = '';
        document.getElementById('rep-notes').value = '';
      }
      document.getElementById('mo-report').classList.add('active');
    }

    function deleteReport(id) {
      if (confirm("Are you sure you want to delete this report?")) {
        appData.reports = appData.reports.filter(x => x.id !== id);
        saveState();
        renderReports();
      }
    }

    function saveReport() {
      const id = document.getElementById('rep-id').value;
      const date = document.getElementById('rep-date').value;
      const incidentType = document.getElementById('rep-type').value;
      const title = document.getElementById('rep-title').value;
      const notes = document.getElementById('rep-notes').value;

      if (!title) return alert("Report title is required.");

      if (id) {
        const idx = appData.reports.findIndex(x => x.id === id);
        if (idx !== -1) {
          appData.reports[idx] = { id, date, incidentType, title, notes };
        }
      } else {
        appData.reports.push({
          id: 'r_' + Date.now(),
          date, incidentType, title, notes
        });
      }

      saveState();
      renderReports();
      CM('mo-report');
    }
  </script>
</body>
</html>
